[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "culturechamp-backend"
version = "0.1.0"
description = "API scaffold for the next CultureChamp concept"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "geoalchemy2==0.20.0",
  "httpx>=0.28.1,<0.29",
  "pypdf==6.19.0",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "uvicorn[standard]==0.53.0",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.32",
  "fastembed>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9.0,<10",
  "ruff>=0.14,<0.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
